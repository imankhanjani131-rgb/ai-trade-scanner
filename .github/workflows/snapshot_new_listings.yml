name: Snapshot New Listings Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-new-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Build fixed snapshot
        id: build
        continue-on-error: true
        run: |
          set +e
          python snapshot_new_listings.py > snapshot_output.txt 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          cat snapshot_output.txt
          exit 0

      - name: Show full diagnostic in Summary
        if: always()
        run: |
          echo "## Snapshot Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Python exit code: ${{ steps.build.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat snapshot_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify snapshot file
        if: steps.build.outputs.exit_code == '0'
        run: |
          test -s snapshot_new_listings.json
          echo "SNAPSHOT FILE EXISTS"

      - name: Upload snapshot artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-new-listings
          path: snapshot_new_listings.json
          retention-days: 90

      - name: Fail if Python failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "Snapshot Python script failed."
          exit 1
