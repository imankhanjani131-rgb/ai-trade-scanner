name: Snapshot New Listings Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-new-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Build fixed snapshot
        run: |
          python snapshot_new_listings.py | tee snapshot_output.txt

      - name: Show results in Summary
        if: always()
        run: |
          echo "## New Listing Data Snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat snapshot_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Save snapshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snapshot_new_listings.json

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Save fixed new listing data snapshot"
            git push
          fi
