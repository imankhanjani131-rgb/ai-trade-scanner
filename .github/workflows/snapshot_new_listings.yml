name: Snapshot New Listings Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-new-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Build fixed snapshot
        run: |
          python snapshot_new_listings.py | tee snapshot_output.txt

      - name: Verify snapshot file
        run: |
          test -s snapshot_new_listings.json

          python - <<'PY'
          import json
          import hashlib

          path = "snapshot_new_listings.json"

          with open(path, "rb") as f:
              raw = f.read()

          data = json.loads(raw.decode("utf-8"))

          print("SNAPSHOT FILE OK")
          print("SIZE:", len(raw), "bytes")
          print("SHA256:", hashlib.sha256(raw).hexdigest())
          print("ITEMS:", list(data.get("items", {}).keys()))
          PY

      - name: Save fixed snapshot to cache
        uses: actions/cache/save@v4
        with:
          path: snapshot_new_listings.json
          key: new-listing-snapshot-v1-${{ github.run_id }}

      - name: Save backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-new-listings-${{ github.run_id }}
          path: snapshot_new_listings.json
          retention-days: 90

      - name: Show results in Summary
        if: always()
        run: |
          echo "## New Listing Data Snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat snapshot_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
