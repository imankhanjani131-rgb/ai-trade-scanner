name: AI Trade Scanner Short PRO Backtest

on:
  workflow_dispatch:

jobs:
  short-pro-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ccxt pandas ta requests

      - name: Run SHORT PRO backtest
        run: python backtest_short_pro.py
