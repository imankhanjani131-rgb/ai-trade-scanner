name: P1 BTC SOL 365D Validation

on:
  workflow_dispatch:

jobs:
  p1-btc-sol-365-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy ta

      - name: Run P1 BTC SOL 365D Validation
        shell: bash
        run: |
          set -o pipefail
          python -u p1_btc_sol_365_validation.py | tee p1_btc_sol_365_validation_output.txt

      - name: Show final results in Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## P1 BTC + SOL 365D Validation Results"
            echo '```text'
            tail -n 220 p1_btc_sol_365_validation_output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-btc-sol-365-validation-output
          path: p1_btc_sol_365_validation_output.txt
          if-no-files-found: ignore
