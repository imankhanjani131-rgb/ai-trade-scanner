name: New Listing Hunter V1

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  new-lististing-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore listing state
        uses: actions/cache@v4
        with:
          path: new_listing_state.json
          key: new-listing-state-${{ github.run_id }}
          restore-keys: |
            new-listing-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run New Listing Hunter V1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python new_listing_hunter.py

      - name: Save listing state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: new_listing_state.json
          key: new-listing-state-${{ github.run_id }}
