name: AI Trade Scanner Short Backtest

on:
  workflow_dispatch:

jobs:
  short-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ccxt pandas ta requests

      - name: Run SHORT backtest
        run: python backtest_short.py
