name: Find Unseen New Listing Candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-unseen-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Candidate Finder
        id: finder
        continue-on-error: true
        run: |
          set +e
          python find_unseen_candidates.py > finder_output.txt 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          cat finder_output.txt
          exit 0

      - name: Show Finder Results in Summary
        if: always()
        run: |
          echo "## Unseen Candidate Finder" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Python exit code: ${{ steps.finder.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat finder_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if finder failed
        if: steps.finder.outputs.exit_code != '0'
        run: |
          echo "Candidate finder failed."
          exit 1
