name: Replay New Listing Hunter V1.2

on:
  workflow_dispatch:

jobs:
  replay-new-listings-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Replay New Listing Hunter V1.2
        run: |
          python replay_new_listing_v12.py | tee replay_v12_output.txt

      - name: Show V1.2 Results in Summary
        if: always()
        run: |
          echo "## Replay New Listing Hunter V1.2" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat replay_v12_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
