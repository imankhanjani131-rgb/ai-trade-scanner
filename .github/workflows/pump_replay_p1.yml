name: Pump Replay P1

on:
  workflow_dispatch:

jobs:
  pump-replay-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas ta

      - name: Run Pump Replay P1
        shell: bash
        run: |
          set -o pipefail
          python -u pump_replay_p1.py | tee pump_replay_p1_output.txt

      - name: Show replay result in Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Pump Replay P1 Results"
            echo '```text'
            tail -n 150 pump_replay_p1_output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full replay output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pump-replay-p1-output
          path: pump_replay_p1_output.txt
          if-no-files-found: ignore
