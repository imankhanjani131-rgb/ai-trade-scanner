name: Compare New Listing Versions Same Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-same-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Same Data Comparison
        id: compare
        continue-on-error: true
        run: |
          set +e
          python replay_compare_same_data.py > compare_output.txt 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          cat compare_output.txt
          exit 0

      - name: Show Comparison in Summary
        if: always()
        run: |
          echo "## V1 vs V1.1 vs V1.2 — Same Data" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Python exit code: ${{ steps.compare.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat compare_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if comparison failed
        if: steps.compare.outputs.exit_code != '0'
        run: |
          echo "Comparison script failed."
          exit 1
