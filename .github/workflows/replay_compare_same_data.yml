name: Compare New Listing Versions Same Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-same-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Same Data Comparison
        run: |
          python replay_compare_same_data.py | tee compare_output.txt

      - name: Show Comparison in Summary
        if: always()
        run: |
          echo "## V1 vs V1.1 vs V1.2 — Same Data" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat compare_output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
