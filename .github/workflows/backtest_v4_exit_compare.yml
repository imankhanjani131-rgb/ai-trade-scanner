name: V4 Exit Model Comparison

on:
  workflow_dispatch:

jobs:
  compare-v4-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas ta

      - name: Run V4 exit comparison
        shell: bash
        run: |
          set -o pipefail
          python backtest_v4_exit_compare.py | tee v4_exit_output.txt

      - name: Show A B C results in Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## V4 Exit Model Comparison"
            echo '```text'
            awk '
              /V4 EXIT MODEL COMPARISON/ {show=1}
              /PER-SYMBOL NET R COMPARISON/ {show=0}
              show {print}
            ' v4_exit_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
