name: V4 Exit Model Comparison

on:
  workflow_dispatch:

jobs:
  compare-v4-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas ta

      - name: Run V4 exit comparison
        run: python backtest_v4_exit_compare.py
