name: AI Trade Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: ai-trade-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore signal state
        uses: actions/cache@v4
        with:
          path: signal_state.json
          key: signal-state-${{ github.run_id }}
          restore-keys: |
            signal-state-

      - name: Restore forward test state
        uses: actions/cache@v4
        with:
          path: forward_test.json
          key: forward-test-${{ github.run_id }}
          restore-keys: |
            forward-test-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests ccxt pandas ta

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py
